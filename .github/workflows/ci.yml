name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    # Pinned: Playwright's Chromium does not support ubuntu-latest (26.04) yet.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Mobile and desktop layouts (Playwright, Chromium) against the production build.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # PostgresPrivacyTest runs the privacy flow (JDBC stores, V9 triggers, cascades, purge) on a real database.
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: property_intelligence
          POSTGRES_USER: property
          POSTGRES_PASSWORD: ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U property -d property_intelligence"
          --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Apply migrations
        env:
          PGPASSWORD: ci-only
        run: for f in ../database/migrations/V*.sql; do psql -q -v ON_ERROR_STOP=1 -h localhost -U property -d property_intelligence -f "$f"; done
      - run: chmod +x mvnw && ./mvnw -B test
        env:
          TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/property_intelligence
          TEST_DATABASE_USER: property
          TEST_DATABASE_PASSWORD: ci-only

  ai-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ai-service/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test   # includes the scorer of the AI accuracy evaluation (npm run eval needs a key and a labelled set)

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: property_intelligence
          POSTGRES_USER: property
          POSTGRES_PASSWORD: ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U property -d property_intelligence"
          --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations
        env:
          PGPASSWORD: ci-only
        run: |
          for f in database/migrations/V*.sql; do
            echo "Applying $f"
            psql -v ON_ERROR_STOP=1 -h localhost -U property -d property_intelligence -f "$f"
          done
          psql -h localhost -U property -d property_intelligence -c "\dt"
      - name: Schema and PostGIS search tests
        env:
          PGPASSWORD: ci-only
        run: psql -v ON_ERROR_STOP=1 -h localhost -U property -d property_intelligence -f database/tests/schema_test.sql
      - name: Demo seed loads (twice) and tests still pass alongside it
        env:
          PGPASSWORD: ci-only
        run: |
          for i in 1 2; do
            psql -v ON_ERROR_STOP=1 -h localhost -U property -d property_intelligence -f database/seeds/demo_seed.sql
          done
          psql -v ON_ERROR_STOP=1 -h localhost -U property -d property_intelligence -f database/tests/schema_test.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U property -d property_intelligence \
            -c "SELECT * FROM nearest_by_category('d0000000-0000-4000-8000-0000000000a1')"

  # Database backups and recovery: back up a seeded database, restore it into a new one and check
  # that every table has the same rows and the schema tests pass on the copy.
  backup-restore:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: property_intelligence
          POSTGRES_USER: property
          POSTGRES_PASSWORD: ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U property -d property_intelligence"
          --health-interval 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: property
      PGPASSWORD: ci-only
      PGDATABASE: property_intelligence
    steps:
      - uses: actions/checkout@v4
      - name: PostgreSQL 17 client tools (pg_dump must match the server)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - name: Migrations and demo data
        run: |
          for f in database/migrations/V*.sql; do psql -q -v ON_ERROR_STOP=1 -f "$f"; done
          psql -q -v ON_ERROR_STOP=1 -f database/seeds/demo_seed.sql
      - name: Back up
        run: BACKUP_DIR="$RUNNER_TEMP/backups" scripts/db/backup.sh
      - name: Restore into a new database and verify
        run: |
          dump=$(ls "$RUNNER_TEMP"/backups/*.dump)
          SCHEMA_TEST=database/tests/schema_test.sql scripts/db/restore.sh "$dump" property_restore
          # Restoring over an existing database is refused.
          if scripts/db/restore.sh "$dump" property_restore; then echo "restore overwrote a database" && exit 1; fi
