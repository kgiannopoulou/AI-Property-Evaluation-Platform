spring:
  application:
    name: property-backend
  config:
    # Local development: read the repository's .env (KEY=value lines are valid properties).
    import: optional:file:../.env[.properties]
  jackson:
    deserialization:
      # A missing flag in a request means false / 0; required numbers are still enforced by validation.
      FAIL_ON_NULL_FOR_PRIMITIVES: false
  servlet:
    multipart:
      # 24 photos of up to 5 MB each (the vision API's per-image limit).
      max-file-size: 5MB
      max-request-size: 125MB

server:
  port: ${PORT:8080}
  # Behind a TLS-terminating proxy set FORWARD_HEADERS=framework, so HTTPS (HSTS) and the client address are known.
  forward-headers-strategy: ${FORWARD_HEADERS:none}
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  database:
    # Market, location and building data. Unset = modules report that no data is connected.
    url: ${DATABASE_URL:}
    user: ${DATABASE_USER:property}
    password: ${POSTGRES_PASSWORD:}
  cors:
    allowed-origins: ${FRONTEND_ORIGIN:http://localhost:3000}
  billing:
    # Local development without Stripe: plans switch instantly (never active when Stripe is configured).
    demo-mode: ${BILLING_DEMO_MODE:false}
    stripe:
      secret-key: ${STRIPE_SECRET_KEY:}
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
      price-premium: ${STRIPE_PRICE_PREMIUM:}
      price-professional: ${STRIPE_PRICE_PROFESSIONAL:}
  audit:
    # Salt for the client-address hashes in the audit log. Set a long random value in production.
    ip-salt: ${AUDIT_IP_SALT:}
  retention:
    # How long data is kept (GDPR storage limitation); the purge runs daily at 03:30 UTC.
    cron: ${RETENTION_CRON:0 30 3 * * *}
    uploaded-file-days: ${RETENTION_UPLOADED_FILE_DAYS:180}
    audit-days: ${RETENTION_AUDIT_DAYS:365}
    usage-months: ${RETENTION_USAGE_MONTHS:24}
    billing-event-days: ${RETENTION_BILLING_EVENT_DAYS:90}
    enquiry-months: ${RETENTION_ENQUIRY_MONTHS:24}
    revoked-key-days: ${RETENTION_REVOKED_KEY_DAYS:90}
  inspection:
    ai-service-url: ${AI_SERVICE_URL:http://localhost:8090}
    ai-service-token: ${AI_SERVICE_TOKEN:}
    ai-timeout: ${AI_SERVICE_TIMEOUT:5m}
    photo-dir: ${PHOTO_DIR:../.data/photos}

# Secrets (database password, AI service token, Stripe and storage keys) come from environment
# variables and are never sent to the browser. See .env.example at the repository root.
